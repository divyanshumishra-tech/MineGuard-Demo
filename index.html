<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MineGuard — AI-Powered Coal Mine Governance &amp; Compliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#161A20;--ink-soft:#4A525E;--ink-faint:#8A93A0;
  --surface:#FFFFFF;--surface-sunken:#F5F6F8;--surface-raised:#FFFFFF;
  --border:#DEE2E8;--border-soft:#EBEDF1;
  --brand:#1B3A52;--brand-soft:#EAF0F4;
  --accent:#B4791A;--accent-soft:#FBF1DF;
  --green:#1C7A42;--green-soft:#E7F5EC;
  --amber:#B4791A;--amber-soft:#FBF1DF;
  --red:#B3261E;--red-soft:#FBE9E8;
  --critical:#8C1A14;--critical-soft:#F6E3E2;
  --blue:#1D5A9C;--blue-soft:#E9F1FA;
  --radius-s:4px;--radius-m:6px;
  --shadow-1:0 1px 2px rgba(20,24,30,.06);
  --shadow-2:0 2px 10px rgba(20,24,30,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans',-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--surface-sunken);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::selection{background:var(--accent-soft)}

#shell{display:flex;min-height:100vh}
#sidebar{width:248px;flex-shrink:0;background:#FFFFFF;color:#344054;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40}
#sidebar .brand{padding:20px 18px 16px;border-bottom:1px solid #E4E7EC}
#sidebar .brand .name{font-weight:700;font-size:17px;letter-spacing:.2px;color:#172033;display:flex;align-items:center;gap:8px}
#sidebar .brand .tag{font-size:10.5px;color:#667085;margin-top:4px;letter-spacing:.3px;line-height:1.4}
#sidebar #nav{flex:1;padding:10px;overflow-y:auto}
#sidebar #sidebar-footer{padding:12px;border-top:1px solid #E4E7EC}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-m);color:#344054;font-size:13.5px;font-weight:600;margin-bottom:2px;transition:background .12s,color .12s;cursor:pointer}
.nav-item:hover{background:#F4F1FF;color:#3D22A8}
.nav-item.active{background:#EEE9FF;color:#3D22A8;font-weight:700}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0;flex-shrink:0}
.nav-item.active .dot{opacity:1;background:var(--accent)}
.nav-item .pill{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:100px}
.nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#667085;padding:14px 12px 6px}
.user-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-m);cursor:pointer}
.user-card:hover{background:rgba(255,255,255,.07)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0}
.user-card .u-name{color:#fff;font-size:13px;font-weight:600}
.user-card .u-role{color:#AFC0CC;font-size:11.5px}

#main{margin-left:248px;flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
#topbar .controls{display:flex;align-items:center;gap:8px}
.tb-select{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-s);padding:6px 10px;font-size:12.5px;color:var(--ink-soft);font-weight:500}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);position:relative}
.icon-btn:hover{background:var(--surface-sunken)}
.badge-dot{position:absolute;top:3px;right:3px;min-width:15px;height:15px;padding:0 3px;border-radius:100px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--surface)}

#page-content{padding:22px 26px 90px;max-width:1440px;width:100%}

.h1{font-size:21px;font-weight:700;letter-spacing:-.2px;color:var(--ink)}
.h2{font-size:16px;font-weight:700;color:var(--ink)}
.h3{font-size:13.5px;font-weight:700;color:var(--ink)}
.sub{font-size:13px;color:var(--ink-soft);margin-top:3px}
.label{font-size:11px;font-weight:600;color:var(--ink-faint);letter-spacing:.3px;text-transform:uppercase}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow-1)}
.card-pad{padding:16px 18px}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border-soft);gap:10px;flex-wrap:wrap}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px 16px}
.kpi .val{font-size:24px;font-weight:700;font-family:'IBM Plex Mono'}
.kpi .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px}
.kpi .delta{font-size:11px;margin-top:6px;font-weight:600}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:100px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-green{background:var(--green-soft);color:var(--green)}
.badge-amber{background:var(--amber-soft);color:var(--amber)}
.badge-red{background:var(--red-soft);color:var(--red)}
.badge-critical{background:var(--critical);color:#fff}
.badge-blue{background:var(--blue-soft);color:var(--blue)}
.badge-gray{background:var(--surface-sunken);color:var(--ink-soft);border:1px solid var(--border)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius-s);font-size:12.5px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--ink)}
.btn:hover{background:var(--surface-sunken)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:#122A3D}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{background:#9C6414}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-success{background:var(--green);border-color:var(--green);color:#fff}
.btn-success:hover{background:#155E33}
.btn-sm{padding:5px 10px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface-sunken);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
tr.row-clickable:hover{background:var(--surface-sunken);cursor:pointer}

.progress-track{height:7px;background:var(--surface-sunken);border-radius:100px;overflow:hidden;border:1px solid var(--border-soft)}
.progress-fill{height:100%;border-radius:100px}

.overlay{position:fixed;inset:0;background:rgba(20,24,30,.45);z-index:100;display:flex;justify-content:center;align-items:center;padding:20px}
.modal{background:#fff;width:640px;max-width:96vw;border-radius:var(--radius-m);box-shadow:var(--shadow-2);max-height:90vh;overflow-y:auto}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2;gap:10px}

.alert-row{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border-soft)}
.alert-icon{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}

#demo-bar{position:fixed;bottom:0;left:248px;right:0;background:var(--ink);color:#fff;z-index:200;padding:12px 24px;display:none;align-items:center;gap:16px;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
#demo-bar.show{display:flex}
#demo-bar .step-text{flex:1;font-size:13px}
#demo-bar .step-count{font-family:'IBM Plex Mono';font-size:11px;color:#9FB0BF}

.toast-wrap{position:fixed;top:70px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--radius-s);font-size:12.5px;box-shadow:var(--shadow-2);min-width:260px;display:flex;gap:8px;align-items:flex-start}

.chip{padding:5px 11px;border:1px solid var(--border);border-radius:100px;font-size:12px;font-weight:500;color:var(--ink-soft);background:var(--surface);cursor:pointer}
.chip.active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.factor-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.factor-bar-row .flabel{width:190px;font-size:12.5px;color:var(--ink-soft);flex-shrink:0}
.factor-bar-row .ftrack{flex:1;height:9px;background:var(--surface-sunken);border-radius:100px;overflow:hidden;border:1px solid var(--border-soft)}
.factor-bar-row .fval{width:74px;text-align:right;font-family:'IBM Plex Mono';font-size:12px;font-weight:600}
.empty-state{padding:40px 20px;text-align:center;color:var(--ink-faint)}

/* ---- NEW COMPONENTS ---- */
.hero-risk{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.risk-dial{width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:8px solid var(--border);position:relative}
.risk-dial .num{font-family:'IBM Plex Mono';font-size:34px;font-weight:700;line-height:1}
.risk-dial .den{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-faint);margin-top:2px}

.why-list{display:grid;gap:8px}
.why-item{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:9px 12px;border-radius:var(--radius-s);background:var(--surface-sunken);border-left:3px solid var(--amber)}
.why-item.crit{border-left-color:var(--critical);background:var(--critical-soft)}

.check-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-s);margin-bottom:8px;background:var(--surface)}
.check-item .cl{font-size:13.5px;font-weight:500}
.check-toggle{display:flex;gap:6px}
.check-btn{padding:5px 12px;border-radius:100px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;font-weight:700;color:var(--ink-faint)}
.check-btn.yes.on{background:var(--green);border-color:var(--green);color:#fff}
.check-btn.no.on{background:var(--red);border-color:var(--red);color:#fff}

.evidence-thumb{width:100%;max-width:320px;border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;background:var(--surface-sunken)}
.evidence-thumb img{width:100%;display:block;max-height:240px;object-fit:cover}

.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meta-box{background:var(--surface-sunken);border:1px solid var(--border-soft);border-radius:var(--radius-s);padding:9px 11px}
.meta-box .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);font-weight:600}
.meta-box .v{font-size:12.5px;font-weight:600;margin-top:2px;font-family:'IBM Plex Mono';word-break:break-all}

.timeline{position:relative;padding-left:22px}
.timeline:before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:14px}
.tl-item:before{content:'';position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--border)}
.tl-item.done:before{background:var(--green)}
.tl-item .t{font-size:12px;color:var(--ink-faint);font-family:'IBM Plex Mono'}
.tl-item .a{font-size:13px;font-weight:600}
.tl-item .d{font-size:12px;color:var(--ink-soft)}

.step-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.step-node{padding:6px 11px;border-radius:100px;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--surface-sunken);color:var(--ink-faint)}
.step-node.done{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.step-node.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.offline-banner{background:repeating-linear-gradient(45deg,#B4791A,#B4791A 12px,#9C6414 12px,#9C6414 24px);color:#fff;padding:9px 16px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;border-radius:var(--radius-s);margin-bottom:12px}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;animation:pl 1.2s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}

.role-card{border:2px solid var(--border);border-radius:var(--radius-m);padding:14px 10px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:#fff}
.role-card:hover{border-color:var(--accent)}
.role-card.sel{border-color:var(--accent);background:var(--accent-soft)}
.role-card .ic{font-size:24px}
.role-card .nm{font-weight:600;font-size:13px;margin-top:5px}
.role-card .ds{font-size:10.5px;color:var(--ink-soft);margin-top:3px;line-height:1.35}

.gis-marker{cursor:pointer}

@media (max-width:1100px){.kpi-row{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){
  #sidebar{transform:translateX(-100%);transition:transform .2s}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  #demo-bar{left:0}
  #hamburger{display:block!important}
}
@media (max-width:700px){
  #page-content{padding:16px 12px 90px}
  #topbar{padding:0 12px}
  .kpi-row{grid-template-columns:1fr 1fr}
  .factor-bar-row .flabel{width:120px}
}
</style>
<style id="mineguard-dashboard-text-contrast">

</style>
</head>

    <div class="brand">

<script>
/* ================================================================
   1. STATE
   ================================================================ */
const STATE = {
  currentUser: null,
  role: null,
  view: 'overview',

  selectedMineId: null,
  selectedContractorId: null,
  selectedInspectionId: null,
  selectedAlertId: null,
  selectedActionId: null,
  selectedViolationId: null,

  offline: false,
  pendingSync: [],
  gpsCapture: null,
  currentPhoto: null,
  checklist: [],
  activeAssignmentId: null,
  submittedInspection: null,

  mines: [],
  contractors: [],
  inspections: [],
  violations: [],
  alerts: [],
  correctiveActions: [],
  certifications: [],
  documents: [],

  workflow: {
    assignedInspectionId: null,
    violationId: null,
    alertId: null,
    actionId: null,
    evidenceSubmitted: false,
    verified: false
  },

  demoActive: false,
  alertFilter: 'All',
  violationFilter: 'All',
  mineRiskFilter: 'All',
  inspectionFilter: { mine: 'All', severity: 'All', status: 'All' },
  documentFilter: 'All'
};

/* ================================================================
   2. RISK ENGINE — deterministic & explainable
   ================================================================ */
const RISK_WEIGHTS = { recurring: 25, overdue: 20, safety: 25, contractor: 15, history: 15 };

const DRIVER_META = [
  { key: 'recurring',  label: 'Recurring violations',        weight: 25, hint: 'Repeated safety failures at the same mine' },
  { key: 'overdue',    label: 'Overdue corrective actions',  weight: 20, hint: 'Corrective actions past their deadline' },
  { key: 'safety',     label: 'Emergency / safety failures', weight: 25, hint: 'Critical emergency-equipment and safety findings' },
  { key: 'contractor', label: 'Contractor performance',      weight: 15, hint: 'Engaged contractor compliance & violation history' },
  { key: 'history',    label: 'Recent inspection history',   weight: 15, hint: 'Volume and severity of recent field inspections' }
];

function computeRiskScore(drivers) {
  let total = 0;
  for (const k in RISK_WEIGHTS) total += (drivers[k] || 0) * RISK_WEIGHTS[k] / 100;
  return Math.round(total);
}

function riskLevelOf(score) {
  if (score >= 85) return 'CRITICAL';
  if (score >= 65) return 'HIGH';
  if (score >= 40) return 'MEDIUM';
  return 'LOW';
}

function riskContribution(drivers) {
  return DRIVER_META.map(d => ({
    ...d,
    score: drivers[d.key] || 0,
    points: +(((drivers[d.key] || 0) * d.weight) / 100).toFixed(1)
  }));
}

      compliance: 69,
      drivers: { recurring: 80, overdue: 74, safety: 52, contractor: 66, history: 54 },
      dims: { Safety: 62, Environment: 55, Labour: 74, Production: 92, Statutory: 68 },
      trend: [55, 58, 63, 66, 70, 73], contractorId: 'CTR-104', lastInspection: '2026-09-04 14:10',
      openViolations: 4, overdueActions: 2, recurringFailures: 2, criticalEquipmentIssue: false,

    {

}

/* ================================================================
   5. RISK ENGINE — state-driven recalculation
   ================================================================ */
function applyRiskUpdate(mineId, newDrivers, reason) {
  const mine = getMine(mineId);
  if (!mine) return null;
  const before = mine.risk;
  const beforeLevel = mine.riskLevel;

  if (newDrivers) {
    Object.keys(newDrivers).forEach(k => {
      mine.drivers[k] = Math.max(0, Math.min(100, newDrivers[k]));
    });
  }

  const after = computeRiskScore(mine.drivers);
  const afterLevel = riskLevelOf(after);
  mine.risk = after;
  mine.riskLevel = afterLevel;
  mine.predicted.level = afterLevel;
  if (afterLevel === 'CRITICAL') mine.predicted.concern = 'Emergency equipment failure causing reportable incident';
  else if (afterLevel === 'HIGH') mine.predicted.concern = 'Safety compliance failure';
  else if (afterLevel === 'MEDIUM') mine.predicted.concern = 'Statutory certificate renewal lapse';
  else mine.predicted.concern = 'No immediate issue';

  mine.riskHistory.push({ from: before, to: after, reason, time: nowStr() });
  mine.trend.push(after);
  if (mine.trend.length > 6) mine.trend.shift();

  addAuditEvent('Risk score recalculated', `${mineId}: ${before} → ${after} (${reason})`, mineId, beforeLevel, afterLevel);
  return { before, after, beforeLevel, afterLevel };
}

function recalculateRisk(mineId) {
  // Legacy-compatible wrapper: derive driver pressure from live state.
  const mine = getMine(mineId);
  if (!mine) return;
  const openViolations = STATE.violations.filter(v => v.mine === mineId && v.status === 'Open');
  const overdue = STATE.correctiveActions.filter(a => a.mine === mineId && a.overdue && a.status !== 'Verified' && a.status !== 'Completed');
  const drivers = {
    recurring: Math.min(100, 40 + openViolations.filter(v => v.severity === 'Critical').length * 20 + openViolations.length * 6),
    overdue: Math.min(100, 30 + overdue.length * 12),
    safety: mine.drivers.safety,
    contractor: mine.drivers.contractor,
    history: mine.drivers.history
  };
  applyRiskUpdate(mineId, drivers, 'State-driven recalculation');
}

/* ================================================================
   9. NAVIGATION
   ================================================================ */
function navigateTo(view, params) {
  STATE.view = view;
  if (params) {
    if (params.mineId !== undefined) STATE.selectedMineId = params.mineId;
    if (params.contractorId !== undefined) STATE.selectedContractorId = params.contractorId;
    if (params.alertId !== undefined) STATE.selectedAlertId = params.alertId;
    if (params.inspectionId !== undefined) STATE.selectedInspectionId = params.inspectionId;
    if (params.actionId !== undefined) STATE.selectedActionId = params.actionId;
    if (params.violationId !== undefined) STATE.selectedViolationId = params.violationId;
  }
  let hash = view;
  if (params && params.mineId) hash += '/' + params.mineId;
  else if (params && params.violationId) hash += '/' + params.violationId;
  else if (params && params.actionId) hash += '/' + params.actionId;
  if (location.hash !== '#/' + hash) history.pushState(null, '', '#/' + hash);
  document.getElementById('sidebar')?.classList.remove('open');
  renderApp();
}

window.addEventListener('popstate', () => {
  const parts = location.hash.replace('#/', '').split('/');
  navigateTo(parts[0] || 'overview');
});

/* ================================================================
   10. CONTENT ROUTER
   ================================================================ */
function renderContent() {
  const area = document.getElementById('page-content');
  let html = '';
  switch (STATE.view) {
    case 'overview':
      html = STATE.role === 'manager' ? renderManagerDashboard()
        : STATE.role === 'inspector' ? renderInspectorDashboard()
          : STATE.role === 'corporate' ? renderCorporateDashboard()
            : renderRegulatorDashboard();
      break;
    case 'mines': html = renderMines(); break;
    case 'violations': html = renderViolations(); break;
    case 'inspections': html = renderInspections(); break;
    case 'fieldinspection': html = renderFieldInspection(); break;
    case 'risk': html = renderRiskIntelligence(); break;
    case 'alerts': html = renderAlerts(); break;
    case 'contractors': html = renderContractors(); break;
    case 'documents': html = renderDocuments(); break;
    case 'reports': html = renderReports(); break;
    case 'gis': html = renderGis(); break;
    case 'audit': html = renderAuditTrail(); break;
    case 'verification': html = renderVerification(); break;
    default: html = '<div class="empty-state">Page not found.</div>';
  }
  area.innerHTML = html;
}

function whyMineList(mine) {
  const items = [];
  if (mine.recurringFailures > 0) items.push({ t: `${mine.recurringFailures} recurring safety failures recorded`, c: true });
  if (mine.overdueActions > 0) items.push({ t: `${mine.overdueActions} overdue corrective actions`, c: true });
  if (mine.criticalEquipmentIssue) items.push({ t: `Critical emergency equipment issue (Shaft 4)`, c: true });
  const ctr = getContractor(mine.contractorId);
  if (ctr && (ctr.risk === 'CRITICAL' || ctr.risk === 'HIGH')) items.push({ t: `Contractor compliance declining — ${ctr.name} (${ctr.score}/100)`, c: false });
  const insp = STATE.inspections.filter(i => i.mine === mine.id);
  if (insp.length) items.push({ t: `${insp.length} inspections in the last 60 days`, c: false });
  return `<div class="why-list">${items.map(i => `<div class="why-item ${i.c ? 'crit' : ''}"><span>${i.c ? '⚠️' : '•'}</span><span>${esc(i.t)}</span></div>`).join('')}</div>`;
}

function recommendInspection(mineId) {
  const mine = getMine(mineId);
  if (!mine) return;
  const reason = mine.riskLevel === 'CRITICAL'
    ? 'Recurring safety failures + overdue corrective actions.'
    : mine.riskLevel === 'HIGH'
      ? 'Elevated risk drivers and pending statutory items.'
      : 'Routine monitoring interval reached.';
  openModal(`

function assignInspection(e, mineId) {

  const deadline = document.getElementById('asgDeadline').value;

  const id = 'INSP-' + (2300 + STATE.inspections.length);
  const insp = {
    id, mine: mineId, officer: inspector, type: type + ' Inspection',
    date: nowStr(), severity: priority, status: 'Assigned',
    location: 'Shaft 4', sync: 'Synced',
    observation: 'Assigned — awaiting field submission.',
    evidence: 0, violation: '—', corrective: '—',
    assignedBy: STATE.currentUser.name, deadlineText: deadline, notes
  };
  STATE.inspections.unshift(insp);
  STATE.workflow.assignedInspectionId = id;

function setCheck(id, val) {
  const c = STATE.checklist.find(x => x.id === id);
  if (c) c.ok = val;
  renderContent();
}

function captureGps() {
  const apply = (lat, lon, synthetic) => {
    STATE.gpsCapture = { lat, lon, synthetic, time: nowStr() };
    renderContent();
    toast(synthetic ? 'Synthetic demo GPS captured.' : 'Device GPS captured.', 'success');
  };
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => apply(p.coords.latitude.toFixed(5), p.coords.longitude.toFixed(5), false),
      () => apply('23.74832', '86.41207', true),
      { timeout: 4000 }
    );
  } else {
    apply('23.74832', '86.41207', true);
  }
}

function handlePhotoSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    STATE.currentPhoto = {
      id: 'EV-' + String(Date.now()).slice(-6),
      name: file.name,
      size: file.size,
      dataUrl: ev.target.result,
      time: nowStr()
    };
    renderContent();
  };
  reader.readAsDataURL(file);
}

function removePhoto() { STATE.currentPhoto = null; renderContent(); }

function toggleOffline() {
  STATE.offline = !STATE.offline;
  addAuditEvent(STATE.offline ? 'Connectivity lost' : 'Connectivity restored', 'Field inspection mode', '—', '—', STATE.offline ? 'Offline' : 'Online');
  toast(STATE.offline ? 'Device is now OFFLINE. Records will be stored locally.' : 'Connection restored.', STATE.offline ? 'warn' : 'success');
  renderContent();
}

function submitFieldInspection() {
  const inspId = STATE.workflow.assignedInspectionId;
  const insp = getInspection(inspId);
  if (!insp) return;
  const remarks = document.getElementById('fieldRemarks').value || 'No remarks.';
  const failed = STATE.checklist.filter(c => c.ok === false);

  const payload = {
    ...insp,
    observation: remarks,
    severity: failed.length >= 2 ? 'Critical' : failed.length === 1 ? 'High' : 'Medium',
    status: STATE.offline ? 'Pending Sync' : 'Submitted',
    sync: STATE.offline ? 'Pending Sync' : 'Synced',
    evidence: STATE.currentPhoto ? 1 : 0,
    gps: STATE.gpsCapture ? `${STATE.gpsCapture.lat}, ${STATE.gpsCapture.lon}` : '—',
    gpsSynthetic: STATE.gpsCapture ? STATE.gpsCapture.synthetic : null,
    photo: STATE.currentPhoto,
    checklist: STATE.checklist.map(c => ({ ...c })),
    violation: failed.map(f => f.label).join('; ') || 'None',
    corrective: 'Pending review',
    submittedAt: nowStr()
  };

  if (STATE.offline) {
    STATE.pendingSync.push(payload);
    const idx = STATE.inspections.findIndex(i => i.id === insp.id);
    if (idx >= 0) STATE.inspections[idx] = { ...payload, status: 'Pending Sync' };
    STATE.submittedInspection = payload;
    addAuditEvent('Inspection saved offline', insp.id, insp.id, 'Started', 'Pending Sync');
    toast('Saved locally. Waiting for connectivity.', 'warn');
  } else {
    const idx = STATE.inspections.findIndex(i => i.id === insp.id);
    if (idx >= 0) STATE.inspections[idx] = { ...payload, status: 'Submitted' };
    STATE.submittedInspection = payload;
    addAuditEvent('Inspection submitted', insp.id, insp.id, 'Started', 'Submitted');
    toast('Inspection submitted.', 'success');
  }
  renderContent();
}

function syncNow() {
  if (!STATE.pendingSync.length) { toast('No pending records.', 'info'); return; }
  toast('Synchronizing…', 'info');
  setTimeout(() => {
    STATE.pendingSync.forEach(p => {
      const idx = STATE.inspections.findIndex(i => i.id === p.id);
      if (idx >= 0) STATE.inspections[idx] = { ...p, status: 'Submitted', sync: 'Synced' };
      addAuditEvent('Offline record synchronized', p.id, p.id, 'Pending Sync', 'Synced');
    });
    const count = STATE.pendingSync.length;
    STATE.pendingSync = [];
    if (STATE.submittedInspection) STATE.submittedInspection.sync = 'Synced';
    STATE.offline = false;
    toast(`${count} record(s) synchronized.`, 'success');
    renderContent();
  }, 1200);
}

function reportViolation() {
  const s = STATE.submittedInspection;
  if (!s) return;
  const mine = getMine(s.mine);
  const failed = (s.checklist || []).filter(c => c.ok === false);
  const issue = failed.some(f => /emergency/i.test(f.label))
    ? 'Emergency equipment unavailable'
    : failed.map(f => f.label).join('; ') || 'Safety non-compliance';

  const id = 'V003';
  const violation = {
    id, mine: s.mine, contractorId: mine.contractorId,
    category: 'Safety', severity: 'Critical',
    issue, location: 'Shaft 4',
    date: nowStr().slice(0, 10), time: nowStr().slice(11, 16),
    inspector: STATE.currentUser.name,
    gps: s.gps, gpsSynthetic: s.gpsSynthetic,
    status: 'Open', evidence: s.evidence,
    photo: s.photo, inspectionId: s.id,
    pattern: 'Emergency Equipment Failure'
  };
  STATE.violations.unshift(violation);
  STATE.workflow.violationId = id;

  addAuditEvent('Violation reported', `${id} — ${issue}`, id, 'None', 'Open');
  addAuditEvent('GPS & evidence captured', `${id} · ${s.gps}`, id, '—', 'Captured');

  // --- Recurring violation detection ---
  const related = STATE.violations.filter(v =>
    v.id !== id && v.mine === s.mine &&
    (v.pattern === 'Emergency Equipment Failure' || /emergency/i.test(v.issue))
  );
  const occurrenceCount = related.length + 1;

  const pattern = {
    id: 'PAT-001',
    mine: s.mine,
    pattern: 'Emergency Equipment Failure',
    occurrences: occurrenceCount,
    latest: 'Today',
    previous: related.map(v => ({ id: v.id, date: v.date, issue: v.issue, location: v.location })),
    status: occurrenceCount >= 3 ? 'Recurring / Critical' : 'Emerging',
    detectedAt: nowStr()
  };
  const existing = STATE.recurringPatterns.findIndex(p => p.mine === s.mine && p.pattern === pattern.pattern);
  if (existing >= 0) STATE.recurringPatterns[existing] = pattern;
  else STATE.recurringPatterns.push(pattern);

  addAuditEvent('AI recurring analysis completed',
    `${occurrenceCount} occurrences of "${pattern.pattern}" detected`, id, '—', pattern.status);

  // --- Risk recalculation: driver deltas ---
  const before = mine.risk;
  applyRiskUpdate(s.mine, {
    recurring: Math.min(100, mine.drivers.recurring + 4),
    overdue: Math.min(100, mine.drivers.overdue + 4),
    contractor: Math.min(100, mine.drivers.contractor + 3),
    history: Math.min(100, mine.drivers.history + 2)
  }, 'Critical violation + recurring pattern detected');
  mine.recurringFailures = occurrenceCount;

  // --- Contractor correlation ---
  const ctr = getContractor(mine.contractorId);
  if (ctr) {
    ctr.violations += 1;
    ctr.score = Math.max(0, ctr.score - 4);
    ctr.risk = ctr.score <= 45 ? 'CRITICAL' : ctr.score <= 65 ? 'HIGH' : 'MEDIUM';
    addAuditEvent('Contractor risk correlated', `${ctr.name}: score ${ctr.score}, risk ${ctr.risk}`, ctr.id, 'HIGH', ctr.risk);
  }

  // --- Automatic alert ---
  const alertId = 'ALT-' + (910 + STATE.alerts.length);
  const alert = {
    id: alertId,
    level: 'Critical',
    title: `Critical Safety Violation — ${mine.name}`,
    reason: `${id}: ${issue} at ${violation.location}. Recurring pattern detected (${occurrenceCount} occurrences).`,
    action: 'Assign corrective action to restore emergency equipment readiness within 24 hours.',
    assignee: 'Mine Safety Officer',
    deadline: '24 hours',
    status: 'Open',
    mine: s.mine,
    time: 'just now',
    violationId: id,
    recipients: ['manager', 'corporate', 'regulator']
  };
  STATE.alerts.unshift(alert);
  STATE.workflow.alertId = alertId;

  addAuditEvent('Automatic alert generated', alertId, alertId, 'None', 'Open');
  addNotification('manager', 'alert', '🚨 Critical Safety Violation', `${id} at ${mine.name}. ${issue}.`, { type: 'alert', id: alertId });
  addNotification('corporate', 'alert', '🚨 Critical Safety Violation', `${id} at ${mine.name}.`, { type: 'alert', id: alertId });
  addNotification('regulator', 'alert', 'Critical violation reported', `${id} at ${mine.name}.`, { type: 'alert', id: alertId });

  toast(`Violation ${id} created. Recurring pattern detected. Risk escalated ${before} → ${mine.risk}.`, 'warn');
  renderContent();
  setTimeout(() => showRecurringAnalysis(), 600);
}

  }
  return html;
}

function acknowledgeAlert(id) {

  a.status = 'Acknowledged';

  renderContent();
}

function resolveAlert(id) {
  const a = getAlert(id);
  if (!a) return;
  a.status = 'Resolved';
  addAuditEvent('Alert resolved', id, id, a.status, 'Resolved');
  const ca = STATE.correctiveActions.find(c => c.alertId === id);
  if (ca) { ca.status = 'Verified'; ca.evidenceVerified = true; }
  if (a.violationId) {
    const v = getViolation(a.violationId);
    if (v) v.status = 'Closed';
  }
  if (a.mine) {
    const mine = getMine(a.mine);
    if (mine) {
      mine.drivers.safety = 20;
      mine.drivers.overdue = Math.max(0, mine.drivers.overdue - 16);
      applyRiskUpdate(a.mine, null, 'Alert resolved — corrective action verified');
    }
  }
  toast('Alert resolved.', 'success');
  renderContent();
}

function submitEvidence(e, actionId) {
  e.preventDefault();
  const ca = getAction(actionId);
  if (!ca) return;
  const notes = document.getElementById('evNotes').value;
  const photoFile = document.getElementById('evPhoto').files[0];
  const certFile = document.getElementById('evCert').files[0];

  const readFile = f => new Promise(res => {
    if (!f) return res(null);
    const r = new FileReader();
    r.onload = ev => res({ name: f.name, dataUrl: ev.target.result, size: f.size });
    r.readAsDataURL(f);
  });

  Promise.all([readFile(photoFile), readFile(certFile)]).then(([photo, cert]) => {
    const evidence = {
      id: 'EVD-' + String(Date.now()).slice(-6),
      actionId, violationId: ca.violationId, mine: ca.mine,
      photo, cert, notes,
      submittedBy: STATE.currentUser.name,
      submittedAt: nowStr()
    };
    STATE.evidenceRecords.unshift(evidence);

    ca.evidenceSubmitted = true;
    ca.evidenceSubmittedAt = nowStr();
    ca.status = 'Verification Pending';
    ca.evidence = evidence;

    const alert = STATE.alerts.find(a => a.id === ca.alertId);
    if (alert) alert.status = 'Under Review';

    STATE.workflow.evidenceSubmitted = true;

    addAuditEvent('Evidence uploaded', `${ca.id} · ${evidence.id}`, ca.id, 'In Progress', 'Verification Pending');
    addNotification('regulator', 'verification', 'Evidence submitted for verification',
      `${ca.id} (${ca.violationId || ''}) at ${getMineName(ca.mine)}.`, { type: 'action', id: ca.id });

    closeOverlay();
    toast('Evidence submitted. Status: VERIFICATION PENDING.', 'success');
    renderContent();
  });
}

function verifyAndClose(actionId) {
  const ca = getAction(actionId);
  if (!ca) return;

  const mine = getMine(ca.mine);
  const before = mine.risk;
  const beforeLevel = mine.riskLevel;

  // --- Closure state transitions ---
  ca.status = 'Verified';
  ca.evidenceVerified = true;
  ca.verifiedAt = nowStr();
  ca.verifiedBy = STATE.currentUser.name;

  const violation = ca.violationId ? getViolation(ca.violationId) : null;
  if (violation) { violation.status = 'Closed'; violation.closedAt = nowStr(); }

  const alert = STATE.alerts.find(a => a.id === ca.alertId);
  if (alert) alert.status = 'Resolved';

  STATE.workflow.verified = true;

  // --- Risk engine recalculation driven by new state ---
  // Critical safety failure removed; one overdue action cleared; historical
  // recurrence + contractor risk + inspection history still contribute.
  const newDrivers = {
    recurring: Math.max(0, mine.drivers.recurring - 0),   // historical pattern remains
    overdue: Math.max(0, mine.drivers.overdue - 16),      // one overdue cleared
    safety: 20,                                            // active failure removed, residual retained
    contractor: Math.min(100, mine.drivers.contractor),   // contractor risk still elevated
    history: Math.min(100, mine.drivers.history - 4)
  };
  applyRiskUpdate(ca.mine, newDrivers, 'Critical violation closed & corrective action verified');

  const ctr = getContractor(ca.responsibleContractorId);
  if (ctr) { ctr.openActions = Math.max(0, ctr.openActions - 1); ctr.delayedActions = Math.max(0, ctr.delayedActions - 1); }

  addAuditEvent('Officer verification completed', `${ca.id} verified by ${STATE.currentUser.name}`, ca.id, 'Verification Pending', 'Verified');
  addAuditEvent('Violation closed', ca.violationId || '—', ca.violationId || ca.id, 'Open', 'Closed');
  addNotification('manager', 'closure', 'Violation closed', `${ca.violationId} closed after verification.`, { type: 'action', id: ca.id });

  toast(`Verified. ${ca.violationId} CLOSED. Risk score ${before} → ${mine.risk}.`, 'success');

  // --- Show closure summary ---
  setTimeout(() => {
    openModal(`
      <div class="modal-header"><div class="h2">✅ Verification Complete</div><button class="icon-btn" onclick="closeOverlay()">✕</button></div>

        </div>

        <div style="border:2px solid var(--accent);border-radius:6px;padding:14px 16px;background:var(--accent-soft);margin-bottom:16px;">
          <div class="label">Risk score updated</div>
          <div style="display:flex;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap;">
            <span class="mono" style="font-size:28px;font-weight:700;color:${riskHex(beforeLevel)}">${before}</span>
            <span style="font-size:20px;color:var(--ink-faint);">→</span>
            <span class="mono" style="font-size:28px;font-weight:700;color:${riskHex(mine.riskLevel)}">${mine.risk}</span>
            ${riskBadge(mine.riskLevel)}
          </div>
          <div style="margin-top:12px;font-size:13px;line-height:1.9;">
            <div>✓ Critical violation resolved</div>
            <div>✓ Corrective action verified</div>
            <div>✓ Active safety failure removed</div>
            <div>✓ Immediate risk reduced</div>
            <div style="color:var(--amber);">⚠ Historical recurring pattern remains</div>
            <div style="color:var(--amber);">⚠ Contractor risk still elevated</div>
          </div>
        </div>

        <div class="label" style="margin-bottom:8px;">Updated risk contribution</div>
        ${riskExplainBlock(mine, true)}

        <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="closeOverlay();navigateTo('audit')">View Audit Trail</button>
          <button class="btn" onclick="closeOverlay();navigateTo('mines',{mineId:'VIKRAM-001'})">Open Mine Profile</button>
        </div>
      </div>
    `);
  }, 300);

  renderContent();
}

function MG_IMPORT_REPORT() {
  const fileEl = document.getElementById('mgImportFile');
  const titleEl = document.getElementById('mgImportTitle');
  const senderEl = document.getElementById('mgImportSender');
  const errEl = document.getElementById('mgImportError');
  const file = fileEl && fileEl.files ? fileEl.files[0] : null;
  const title = titleEl ? titleEl.value.trim() : '';
  const sender = senderEl ? senderEl.value.trim() : '';
  if (!file || !title || !sender) {
    if (errEl) { errEl.style.display='block'; errEl.textContent='Report title, submitted by and a report file are required.'; }
    return;
  }

  const readAsDataUrl = file.size <= 1800000;
  const finalize = (dataUrl) => {
    const report = {
      id: 'RPT-IMP-' + Date.now() + '-' + Math.random().toString(36).slice(2,8),
      title,
      sender,
      senderRole: (document.getElementById('mgImportRole') || {}).value || '',
      reportType: (document.getElementById('mgImportType') || {}).value || 'General',
      scope: (document.getElementById('mgImportScope') || {}).value || '',
      notes: (document.getElementById('mgImportNotes') || {}).value || '',
      fileName: file.name,
      fileType: file.type || 'application/octet-stream',
      fileSize: file.size,
      importedAt: nowStr(),
      importedBy: STATE.currentUser ? STATE.currentUser.name : 'Unknown',
      importedByRole: STATE.role || 'member',
      dataUrl: dataUrl || null,
      storageNote: dataUrl ? 'File retained locally in browser state.' : 'File metadata retained; large file must be re-imported after browser reset.'
    };
    MG_INIT_IMPORTED_REPORTS().push(report);
    try { MG_SAVE_STATE(); } catch(e) { console.warn('Imported report state save failed', e); }
    closeOverlay();
    renderApp();
    toast('Report imported successfully from ' + sender + '.', 'success');
  };

  if (!readAsDataUrl) {
    finalize(null);
    return;
  }
  const reader = new FileReader();
  reader.onload = () => finalize(reader.result);
  reader.onerror = () => {
    if (errEl) { errEl.style.display='block'; errEl.textContent='The report could not be read. Please try the file again.'; }
  };
  reader.readAsDataURL(file);
}

function MG_GET_IMPORTED_REPORT(id) {
  return MG_INIT_IMPORTED_REPORTS().find(r => r.id === id) || null;
}

function MG_VIEW_IMPORTED_REPORT(id) {

    </div>`);
}

function MG_DOWNLOAD_IMPORTED_REPORT(id) {
  const r = MG_GET_IMPORTED_REPORT(id);
  if (!r) { toast('Imported report not found.', 'warn'); return; }
  if (!r.dataUrl) { toast('The file contents were not retained because the file was too large. Please re-import the original file.', 'warn'); return; }
  const a = document.createElement('a');
  a.href = r.dataUrl;
  a.download = r.fileName || 'mineguard-imported-report';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Report download started.', 'success');
}

function MG_DELETE_IMPORTED_REPORT(id) {
  const r = MG_GET_IMPORTED_REPORT(id);
  if (!r) return;
  if (!confirm('Remove imported report "' + (r.title || r.fileName) + '" from MineGuard?')) return;
  STATE.importedReports = MG_INIT_IMPORTED_REPORTS().filter(x => x.id !== id);
  MG_SAVE_STATE();
  renderApp();
  toast('Imported report removed.', 'info');
}

  { role: 'manager', view: 'mines', params: { mineId: 'VIKRAM-001' }, text: 'Step 2 — Open Vikram Underground Mine (risk 91 / CRITICAL).' },
  { role: 'manager', action: 'showWhyRisk', text: 'Step 3 — Explainable AI: every point traced to a weighted driver.' },
  { role: 'manager', action: 'recommendInspection', text: 'Step 4 — AI recommends a priority inspection within 24 hours.' },
  { role: 'manager', action: 'showAssignInspectionModal', text: 'Step 5 — Assign Critical safety inspection to Rahul Sharma.' },
  { role: 'inspector', view: 'overview', text: 'Step 6 — Field Inspector sees the assigned critical inspection.' },
  { role: 'inspector', action: 'startInspection', text: 'Step 7 — Start the field inspection.' },
  { role: 'inspector', action: 'toggleOffline', text: 'Step 8 — Connectivity lost: offline mode activated.' },
  { role: 'inspector', action: 'captureGps', text: 'Step 9 — Capture geo-tag, timestamp and photo evidence.' },
  { role: 'inspector', action: 'submitFieldInspection', text: 'Step 10 — Checklist recorded, saved locally while offline.' },
  { role: 'inspector', action: 'syncNow', text: 'Step 11 — Connectivity restored; record synchronized.' },
  { role: 'inspector', action: 'reportViolation', text: 'Step 12 — Violation V003 created with geo-tagged evidence.' },
  { role: 'inspector', action: 'showRecurringAnalysis', text: 'Step 13 — Recurring pattern detected; risk escalated; alert generated.' },
  { role: 'manager', view: 'alerts', text: 'Step 14 — Mine Manager sees the automatic critical alert.' },
  { role: 'manager', action: 'showCreateActionModal', text: 'Step 15 — Assign corrective action with 24-hour deadline.' },
  { role: 'manager', action: 'showEvidenceUpload', text: 'Step 16 — Responsible officer uploads corrected photo + certificate.' },
  { role: 'regulator', view: 'verification', text: 'Step 17 — Regulator reviews before/after evidence.' },
  { role: 'regulator', action: 'verifyAndClose', text: 'Step 18 — VERIFY & CLOSE: violation closed, risk recalculated 91 → 68.' },
  { role: 'manager', view: 'audit', text: 'Step 19 — Full digital audit trail of the entire lifecycle.' }
];

function startGuidedDemo() {
  if (STATE.demoActive) { toast('Demo already running.', 'info'); return; }
  STATE.demoActive = true;
  window.demoStepIndex = -1;
  document.getElementById('demo-bar').classList.add('show');
  nextDemoStep();
}

function nextDemoStep() {
  window.demoStepIndex++;
  if (window.demoStepIndex >= DEMO_STEPS.length) { endDemo(); return; }
  const step = DEMO_STEPS[window.demoStepIndex];

  if (step.role && step.role !== STATE.role) {
    const cred = DEMO_CREDS[step.role];
    STATE.currentUser = { id: cred.id, name: cred.name, email: cred.email, role: step.role, label: cred.label };
    STATE.role = step.role;
    renderApp();
  }
  if (step.view) navigateTo(step.view, step.params);

  if (step.action) {
    try {
      if (step.action === 'showWhyRisk') showWhyRisk('VIKRAM-001');
      else if (step.action === 'recommendInspection') recommendInspection('VIKRAM-001');
      else if (step.action === 'showAssignInspectionModal') showAssignInspectionModal('VIKRAM-001');
      else if (step.action === 'startInspection') {
        const assigned = STATE.inspections.find(i => i.status === 'Assigned');
        if (assigned) startInspection(assigned.id); else toast('No assigned inspection — assign one first.', 'warn');
      }
      else if (step.action === 'toggleOffline') { if (!STATE.offline) toggleOffline(); }
      else if (step.action === 'captureGps') captureGps();
      else if (step.action === 'submitFieldInspection') { if (!STATE.submittedInspection) submitFieldInspection(); }
      else if (step.action === 'syncNow') { if (STATE.pendingSync.length) syncNow(); }
      else if (step.action === 'reportViolation') { closeOverlay(); if (!STATE.workflow.violationId && STATE.submittedInspection) reportViolation(); }
      else if (step.action === 'showRecurringAnalysis') { if (STATE.workflow.violationId) showRecurringAnalysis(); }
      else if (step.action === 'showCreateActionModal') {
        const alert = STATE.alerts.find(a => a.violationId === 'V003') || STATE.alerts[0];
        closeOverlay(); if (alert) showCreateActionModal(alert.id);
      }
      else if (step.action === 'showEvidenceUpload') {
        const ca = STATE.correctiveActions.find(a => a.violationId === 'V003') || STATE.correctiveActions[0];
        closeOverlay(); if (ca) showEvidenceUpload(ca.id);
      }
      else if (step.action === 'verifyAndClose') {
        const ca = STATE.correctiveActions.find(a => a.violationId === 'V003' && a.status === 'Verification Pending');
        closeOverlay();
        if (ca) verifyAndClose(ca.id);
        else toast('No action pending verification — submit evidence first.', 'warn');
      }
    } catch (err) { console.warn('Demo step error', err); }
  }

  document.getElementById('demo-bar').innerHTML = `
    <span class="step-count">DEMO ${window.demoStepIndex + 1}/${DEMO_STEPS.length}</span>
    <span class="step-text">${step.text}</span>
    <button class="btn btn-sm" onclick="endDemo()">Exit</button>
    <button class="btn btn-accent btn-sm" onclick="nextDemoStep()">${window.demoStepIndex + 1 >= DEMO_STEPS.length ? 'Finish' : 'Next →'}</button>`;
}

function endDemo() {
  STATE.demoActive = false;
  document.getElementById('demo-bar').classList.remove('show');
  document.getElementById('demo-bar').innerHTML = '';
}

/* ================================================================
   33. RESET
   ================================================================ */
function resetDemo() {
  if (!confirm('Reset all demo data to initial state?')) return;
  const role = STATE.role;
  const user = STATE.currentUser;
  initDemoData();
  STATE.role = role;
  STATE.currentUser = user;
  STATE.view = 'overview';
  STATE.selectedMineId = null;
  STATE.selectedViolationId = null;
  STATE.selectedActionId = null;
  STATE.selectedAlertId = null;
  closeOverlay();
  toast('Demo data reset.', 'success');
  renderApp();
}

/* ================================================================
   34. INIT
   ================================================================ */
function init() {
  renderApp();

  const controls = document.querySelector('.controls');
  if (controls && !document.getElementById('resetBtn')) {
    const btn = document.createElement('button');
    btn.id = 'resetBtn';
    btn.className = 'icon-btn';
    btn.title = 'Reset Demo';
    btn.innerHTML = '⟳';
    btn.onclick = resetDemo;
    controls.appendChild(btn);
  }

  const hamburger = document.getElementById('hamburger');
  if (hamburger) {
    const update = () => { hamburger.style.display = window.innerWidth <= 900 ? 'block' : 'none'; };
    update();
    window.addEventListener('resize', update);
  }
}

init();
</script>

  /* ----------------------------------------------------------

    const prev=h.pop();

    STATE.selectedMineId=prev.selectedMineId;

      ['evidence','Evidence','📎'],['reports','Reports','📊'],
      ['gis','Mine Map','🗺️'],['audit','Audit Trail','📜']
    ],
    corporate:[
      ['overview','Dashboard','📊'],['mines','Mines','⛏️'],
      ['risk','Portfolio Risk','📈'],['violations','Violations','⚠️'],
      ['contractors','Contractors','👥'],['certifications','Certifications','🎓'],
      ['compliance','Compliance','✓'],['trends','Trends','📉'],
      ['reports','Reports','📊'],['gis','Mine Map','🗺️'],['audit','Audit Trail','📜']
    ],
    regulator:[
      ['overview','Dashboard','🏛️'],['verification','Verification Queue','✅'],

  function mgNavAllowed(key){

      overview:'dashboard.view', mines:'mines.view', inspections:'inspections.view',

  function mgSearchEntities(q){
    if(!q) return [];
    const out=[];
    const push=(type,icon,id,title,sub)=>{if(!MG_ENTITY_VISIBLE(type,id))return;const hay=(title+' '+sub+' '+id).toLowerCase();if(hay.includes(q))out.push({type,icon,id,title,sub})};
    STATE.mines.forEach(m=>push('Mine','⛏️',m.id,m.name,`${m.region||m.location||''} · Risk ${m.risk||0}`));
    STATE.contractors.forEach(c=>push('Contractor','👥',c.id,c.name,`${c.status||'Active'} · ${c.risk||'—'}`));
    STATE.inspections.forEach(i=>push('Inspection','📋',i.id,i.type||'Inspection',`${mgMineName(i.mine)} · ${i.status||'—'}`));
    STATE.violations.forEach(v=>push('Violation','⚠️',v.id,v.issue||v.category||'Violation',`${mgMineName(v.mine)} · ${mgViolationSeverity(v)}`));
    STATE.alerts.forEach(a=>push('Alert','🔔',a.id,a.title||a.reason||'Alert',`${mgMineName(a.mine)} · ${a.status||'—'}`));
    STATE.correctiveActions.forEach(a=>push('Corrective Action','🛠️',a.id,a.title||a.issue||'Corrective Action',`${mgMineName(mgActionMine(a))} · ${a.status||'—'}`));
    return out.slice(0,30);
  }

  function MG_ENTITY_VISIBLE(type,id){
    const role=STATE.role;
    if(role!=='contractor') return true;
    if(type==='Mine') return true;
    if(type==='Contractor') return id===STATE.currentUser.id;
    const me=STATE.currentUser.name;
    if(type==='Inspection'){const i=STATE.inspections.find(x=>x.id===id);return !!i&&(i.officer===me||i.inspector===me);}
    if(type==='Violation'){const v=STATE.violations.find(x=>x.id===id);return !!v&&(v.inspector===me||v.contractorId===(STATE.currentUser.contractorId||STATE.currentUser.id));}
    if(type==='Corrective Action'){const a=STATE.correctiveActions.find(x=>x.id===id);return !!a&&(a.owner===me||a.responsible===me||a.responsibleContractorId===STATE.currentUser.id);}
    return false;
  }

  window.MG_OPEN_SEARCH_RESULT=function(type,id){
    const map={Mine:'mines',Contractor:'contractors',Inspection:'inspections',Violation:'violations',Alert:'alerts','Corrective Action':'alerts'};
    const view=map[type]||'overview';
    const p={};
    if(type==='Mine')p.mineId=id;
    if(type==='Contractor')p.contractorId=id;
    if(type==='Inspection')p.inspectionId=id;
    if(type==='Violation')p.violationId=id;
    if(type==='Alert')p.alertId=id;
    if(type==='Corrective Action')p.actionId=id;
    navigateTo(view,p);
    STATE.searchQuery='';
  };

  window.renderGlobalSearchIntoPage=function(){
    const area=document.getElementById('page-content');
    if(area && STATE.view==='search') area.innerHTML=renderGlobalSearch();
  };

  /* ----------------------------------------------------------
     11. Search box added without replacing original topbar.
     ---------------------------------------------------------- */
  const MG_TOPBAR_ORIGINAL = renderTopbar;
  renderTopbar = function(){
    MG_TOPBAR_ORIGINAL();
    const tb=document.getElementById('topbar');
    if(!tb) return;
    const controls=tb.querySelector('.controls');
    if(controls && !document.getElementById('mgSearchInput')){
      const wrap=document.createElement('div');
      wrap.className='mg-hybrid-search';
      wrap.innerHTML='<input id="mgSearchInput" aria-label="Global MineGuard search" placeholder="Search mines, alerts, inspections...">';
      controls.prepend(wrap);
      const input=wrap.querySelector('input');
      input.addEventListener('keydown',e=>{if(e.key==='Enter'){STATE.searchQuery=input.value;navigateTo('search');}});
    }
  };

  /* ----------------------------------------------------------
     12. New role login screen.
     Existing login behavior is retained through login().
     ---------------------------------------------------------- */
  renderAuth = function(){
    showSidebar();
    document.getElementById('sidebar').style.display='none';
    const content=document.getElementById('page-content');
    const roles=['inspector','manager','corporate','regulator','supervisor','contractor'];
    content.innerHTML=`
      <div style="max-width:760px;margin:30px auto;background:var(--surface);border-radius:var(--radius-m);padding:34px 30px;border:1px solid var(--border);box-shadow:var(--shadow-2);">
        <div style="text-align:center;margin-bottom:22px;"><div style="font-size:28px;font-weight:700;color:var(--brand);letter-spacing:-.5px;display:flex;align-items:center;justify-content:center;gap:8px;">⛏️ MINEGUARD</div><div style="font-size:13px;color:var(--ink-soft);margin-top:6px;">AI-Powered Coal Mine Governance &amp; Compliance</div></div>
        <div style="text-align:center;margin-bottom:22px;"><div style="font-size:16px;font-weight:600;">Prevent compliance failures before they become incidents.</div><div style="font-size:13px;color:var(--ink-soft);margin-top:4px;">Choose a demo role to enter the governance workspace.</div></div>
        <div class="label" style="margin-bottom:8px;">Select Role</div>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;" id="roleGrid">${roles.map(r=>`<div class="role-card" id="role-${r}" onclick="selectRole('${r}')"><div class="ic">${DEMO_CREDS[r].icon}</div><div class="nm">${DEMO_CREDS[r].label}</div><div class="ds">${DEMO_CREDS[r].desc}</div></div>`).join('')}</div>
        <div id="loginPanel" style="display:none;border-top:1px solid var(--border);padding-top:18px;"><div style="font-weight:600;font-size:14px;" id="loginRoleLabel">Login</div><div class="sub" style="margin-bottom:12px;">Demo credentials are pre-filled.</div><div style="margin-bottom:10px;"><label style="display:block;font-size:12px;font-weight:600;color:var(--ink-soft);">Email / User ID</label><input type="email" id="loginEmail" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-s);font-size:13px;"></div><div style="margin-bottom:14px;"><label style="display:block;font-size:12px;font-weight:600;color:var(--ink-soft);">Password</label><input type="password" id="loginPassword" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-s);font-size:13px;"></div><button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="performLogin()">Login</button><div id="authError" style="color:var(--red);font-size:13px;margin-top:10px;display:none;"></div></div>
      </div>`;
    window.selectRole=function(role){document.querySelectorAll('.role-card').forEach(el=>el.classList.remove('sel'));const card=document.getElementById('role-'+role);if(card)card.classList.add('sel');document.getElementById('loginPanel').style.display='block';document.getElementById('loginRoleLabel').textContent=DEMO_CREDS[role].label+' Login';document.getElementById('loginEmail').value=DEMO_CREDS[role].email;document.getElementById('loginPassword').value=DEMO_CREDS[role].password;document.getElementById('authError').style.display='none';window._loginRole=role;};
    window.performLogin=function(){const role=window._loginRole||'manager';const email=document.getElementById('loginEmail').value;const password=document.getElementById('loginPassword').value;const res=login(role,email,password);if(res.success){if(role==='contractor'&&STATE.currentUser)STATE.currentUser.contractorId=DEMO_CREDS.contractor.contractorId;MG_SAVE_STATE();renderApp();navigateTo('overview');}else{const e=document.getElementById('authError');e.textContent=res.message;e.style.display='block';}};
  };

  /* ----------------------------------------------------------
     13. Sidebar uses the unified role navigation.
     ---------------------------------------------------------- */
  renderSidebar=function(){
    const nav=document.getElementById('nav');
    const footer=document.getElementById('sidebar-footer');
    const items=navItemsForRole(STATE.role);
    nav.innerHTML=items.map(it=>`<a href="#/${it.key}" class="nav-item ${STATE.view===it.key?'active':''}" data-key="${it.key}"><span class="dot"></span><span>${it.icon}</span><span>${esc(it.label)}</span>${it.pill?`<span class="pill">${it.pill}</span>`:''}</a>`).join('');
    const u=STATE.currentUser;
    footer.innerHTML=`<div class="user-card" id="userCard"><div class="avatar">${u.name.charAt(0).toUpperCase()}</div><div><div class="u-name">${esc(u.name)}</div><div class="u-role">${esc(u.label||u.role)}</div></div></div><button class="btn" style="color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);width:100%;margin-top:8px;justify-content:center;" onclick="logout()">Logout</button>`;
    document.getElementById('userCard').onclick=()=>openUserMenu();
    nav.querySelectorAll('.nav-item[data-key]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();if(mgNavAllowed(el.dataset.key))navigateTo(el.dataset.key);else toast('This area is not available to your role.','error');}));
  };

  /* ----------------------------------------------------------
     14. Content router wrapper.
     Original pages, especially dashboards, remain untouched.
     ---------------------------------------------------------- */
  renderContent=function(){
    const area=document.getElementById('page-content');
    if(!area) return;
    let html='';
    switch(STATE.view){
      case 'overview': html=mgRenderDashboard(STATE.role); break;
      case 'myviolations': html=renderMyViolations(); break;
      case 'myactions': html=renderMyActions(); break;
      case 'verification': html=renderVerificationQueueHybrid(); break;
      case 'certifications': html=renderCertificationsHybrid(); break;
      case 'compliance': html=renderComplianceHybrid(); break;
      case 'evidence': html=renderEvidenceHybrid(); break;
      case 'trends': html=renderTrendsHybrid(); break;
      case 'search': html=renderGlobalSearch(); break;
      default:
        /* Explicitly delegate every original view to the original renderer. */
        MG_ORIGINAL.renderContent();
        return;
    }
    area.innerHTML=html;
    mgAttachBackButton();
  };

  function mgAttachBackButton(){
    const area=document.getElementById('page-content');
    if(!area || STATE.view==='overview' || STATE.view==='search') return;
    if(area.querySelector('.mg-back-button')) return;
    const head=area.firstElementChild;
    if(head && head.classList && head.classList.contains('page-header')) return;
    const btn=document.createElement('button');
    btn.className='btn mg-back-button';
    btn.style.marginBottom='10px';
    btn.textContent='← Back';
    btn.onclick=MG_GO_BACK;
    area.prepend(btn);
  }

  /* ----------------------------------------------------------
     15. Canonical renderApp wrapper.
     This preserves the original shell while using our expanded
     role-aware sidebar and content router.
     ---------------------------------------------------------- */
  renderApp=function(){
    if(!STATE.currentUser){renderAuth();hideSidebar();return;}
    showSidebar();
    renderSidebar();
    renderTopbar();
    renderContent();
    renderNotificationBadge();
    MG_SAVE_STATE();
  };

  /* ----------------------------------------------------------
     16. Strict alert resolution.
     Existing alert UI remains, but the mutation now enforces
     permission and verified evidence.
     ---------------------------------------------------------- */
  resolveAlert=function(id){
    if(!MG_REQUIRE_PERMISSION('alerts.resolve')) return;
    const a=getAlert(id);
    if(!a){toast('Alert not found.','error');return;}
    const ca=STATE.correctiveActions.find(c=>c.alertId===id);
    const hasEvidence=!!(ca && (ca.evidenceSubmitted || ca.evidenceVerified || (ca.evidence && ca.evidence.length)));
    const verified=!!(ca && ca.evidenceVerified);
    if(!ca){toast('Cannot resolve alert: corrective action is missing.','error');return;}
    if(!hasEvidence){toast('Evidence is required before this alert can be resolved.','error');return;}
    if(!verified){toast('Evidence must be verified before this alert can be resolved.','error');return;}
    const before=a.status;
    a.status='Resolved';
    ca.status='Verified';
    ca.evidenceVerified=true;
    const v=a.violationId?getViolation(a.violationId):null;
    if(v)v.status='Closed';
    addAuditEvent('Alert resolved',`${id} — evidence verified`,id,before,'Resolved');
    addNotification('manager','alert','Alert resolved',`${id} resolved after verified evidence.`,{type:'alert',id});
    addNotification('regulator','alert','Alert resolved',`${id} closed after evidence verification.`,{type:'alert',id});
    if(a.mine){
      try{recalculateRisk(a.mine);}catch(_e){}
    }
    MG_SAVE_STATE();
    toast('Alert resolved after verified evidence.','success');
    renderApp();
  };

  /* ----------------------------------------------------------
     17. Strict evidence verification.
     ---------------------------------------------------------- */
  verifyAndClose=function(actionId){
    if(!MG_REQUIRE_PERMISSION('evidence.verify')) return;
    const ca=getAction(actionId);
    if(!ca){toast('Corrective action not found.','error');return;}
    const hasEvidence=!!(ca.evidenceSubmitted || (ca.evidence && ca.evidence.length) || ca.evidenceFileName);
    if(!hasEvidence){toast('Verification blocked: no evidence has been submitted.','error');return;}
    if(STATE.currentUser && (ca.owner===STATE.currentUser.name || ca.responsible===STATE.currentUser.name) && STATE.role==='contractor'){
      toast('Independent verification is required; submitter cannot self-verify.','error');return;
    }
    const before=ca.status;
    ca.status='Verified';
    ca.evidenceVerified=true;
    ca.verifiedAt=nowStr();
    ca.verifiedBy=STATE.currentUser.name;
    const v=ca.violationId?getViolation(ca.violationId):null;
    if(v)v.status='Closed';
    const a=ca.alertId?getAlert(ca.alertId):null;
    if(a)a.status='Resolved';
    STATE.workflow.verified=true;
    addAuditEvent('Evidence verified',`${ca.id} verified by ${STATE.currentUser.name}`,ca.id,before,'Verified');
    addNotification('manager','verification','Evidence verified',`${ca.id} has been independently verified.`,{type:'action',id:ca.id});
    if(a)addAuditEvent('Alert resolved',`${a.id} resolved after verification`,a.id,'Action Required','Resolved');
    if(ca.mine){try{recalculateRisk(ca.mine);}catch(_e){}}
    MG_SAVE_STATE();
    toast('Evidence verified and corrective action closed.','success');
    renderApp();
  };

  /* ----------------------------------------------------------
     18. Mutation wrappers for persistence.
     ---------------------------------------------------------- */
  function mgWrap(name){
    const original=window[name];
    if(typeof original!=='function') return;
    window[name]=function(){
      const result=original.apply(this,arguments);
      try{MG_SAVE_STATE();}catch(_e){}
      return result;
    };
  }
  ['assignInspection','submitFieldInspection','submitAction','submitEvidence','acknowledgeAlert','toggleOffline','syncNow'].forEach(mgWrap);

  /* ----------------------------------------------------------
     19. Better acknowledgement permissions.
     ---------------------------------------------------------- */
  const MG_ACK_ORIGINAL=acknowledgeAlert;
  acknowledgeAlert=function(id){
    if(!MG_REQUIRE_PERMISSION('alerts.acknowledge')) return;
    MG_ACK_ORIGINAL(id);
    MG_SAVE_STATE();
  };

  /* ----------------------------------------------------------
     20. Contractor-safe evidence submission entry point.
     Existing modal remains available, but ownership is checked.
     ---------------------------------------------------------- */
  const MG_EVIDENCE_MODAL_ORIGINAL=showEvidenceUpload;
  showEvidenceUpload=function(actionId){
    if(!MG_REQUIRE_PERMISSION('evidence.submit')) return;
    const ca=getAction(actionId);
    if(!ca){toast('Corrective action not found.','error');return;}
    if(STATE.role==='contractor'){
      const allowed=ca.owner===STATE.currentUser.name || ca.responsible===STATE.currentUser.name || ca.responsibleContractorId===STATE.currentUser.id || ca.mine===STATE.selectedMineId;
      if(!allowed){toast('You can only submit evidence for your assigned corrective actions.','error');return;}
    }
    MG_EVIDENCE_MODAL_ORIGINAL(actionId);
  };

  /* ----------------------------------------------------------
     21. Inspection assignment permission.
     ---------------------------------------------------------- */
  const MG_ASSIGN_ORIGINAL=assignInspection;
  assignInspection=function(){
    if(!MG_REQUIRE_PERMISSION('inspections.assign')) return;
    const result=MG_ASSIGN_ORIGINAL.apply(this,arguments);
    MG_SAVE_STATE();
    return result;
  };

  /* ----------------------------------------------------------
     22. Browser storage event keeps multiple tabs coherent.
     ---------------------------------------------------------- */
  window.addEventListener('storage',function(e){
    if(e.key!==MG_STORAGE_KEY || !e.newValue) return;
    try{
      const saved=JSON.parse(e.newValue);
      Object.keys(saved||{}).forEach(k=>{if(k in STATE)STATE[k]=saved[k]});
      if(STATE.currentUser)renderApp();
    }catch(_e){}
  });

  /* ----------------------------------------------------------
     23. Keyboard shortcuts.
     ---------------------------------------------------------- */
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      const overlay=document.getElementById('active-overlay');
      if(overlay)closeOverlay();
    }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
      e.preventDefault();
      const input=document.getElementById('mgSearchInput');
      if(input)input.focus();
    }
  });

  /* ----------------------------------------------------------
     24. Offline queue helper.
     ---------------------------------------------------------- */
  window.MG_QUEUE_OPERATION=function(type,payload){
    STATE.pendingSync=STATE.pendingSync||[];
    STATE.pendingSync.push({id:(crypto.randomUUID?crypto.randomUUID():'SYNC-'+Date.now()),type,payload,timestamp:nowStr(),status:'Pending'});
    MG_SAVE_STATE();
    if(typeof renderNotificationBadge==='function')renderNotificationBadge();
  };

  /* ----------------------------------------------------------
     25. Add a local sync summary to the offline workflow.
     ---------------------------------------------------------- */
  const MG_SYNC_ORIGINAL=syncNow;
  syncNow=function(){
    const before=(STATE.pendingSync||[]).length;
    const result=MG_SYNC_ORIGINAL.apply(this,arguments);
    if(before){
      addAuditEvent('Offline queue synchronized',`${before} pending local operations processed`,'SYNC','Pending','Synced');
    }
    MG_SAVE_STATE();
    return result;
  };

  /* ----------------------------------------------------------
     26. Notification helper for new workflow events.
     ---------------------------------------------------------- */
  window.MG_NOTIFY_ROLE=function(role,title,message,related){
    if(!DEMO_CREDS[role]) return;
    addNotification(role,'workflow',title,message,related||null);
    MG_SAVE_STATE();
  };

  /* ----------------------------------------------------------
     27. Seed missing workspace-style certification records from
     existing contractor data. This is derived local demo data.
     ---------------------------------------------------------- */
  function mgEnsureCertifications(){
    if(!Array.isArray(STATE.certifications))STATE.certifications=[];
    if(STATE.certifications.length)return;
    STATE.contractors.forEach((c,idx)=>{
      STATE.certifications.push({
        id:'CERT-'+String(idx+1).padStart(3,'0'),
        contractor:c.id,
        name:'Mine Safety & Statutory Compliance Certificate',
        issueDate:'2026-01-15',
        expiry:idx%3===0?'2026-09-18':idx%3===1?'2026-12-31':'2027-03-31',
        status:idx%3===0?'Expiring Soon':'Active'
      });
    });
  }

  /* ----------------------------------------------------------
     28. Seed navigation state without changing original data.
     ---------------------------------------------------------- */
  function mgNormalizeState(){
    STATE.navigationHistory=Array.isArray(STATE.navigationHistory)?STATE.navigationHistory:[];
    STATE.pendingSync=Array.isArray(STATE.pendingSync)?STATE.pendingSync:[];
    STATE.notifications=Array.isArray(STATE.notifications)?STATE.notifications:[];
    STATE.auditTrail=Array.isArray(STATE.auditTrail)?STATE.auditTrail:[];
    STATE.evidenceRecords=Array.isArray(STATE.evidenceRecords)?STATE.evidenceRecords:[];
    STATE.certifications=Array.isArray(STATE.certifications)?STATE.certifications:[];
    STATE.searchQuery=String(STATE.searchQuery||'');
    mgEnsureCertifications();
  }

  /* ----------------------------------------------------------
     29. Hybrid report context helper.
     ---------------------------------------------------------- */
  window.MG_REPORT_SUMMARY=function(){
    const mines=STATE.mines||[];
    const violations=STATE.violations||[];
    const actions=STATE.correctiveActions||[];
    const alerts=STATE.alerts||[];
    return {
      generatedAt:nowStr(),
      mines:mines.length,
      criticalMines:mines.filter(m=>m.riskLevel==='CRITICAL').length,
      highMines:mines.filter(m=>m.riskLevel==='HIGH').length,
      openViolations:mgCountOpen(violations),
      openAlerts:mgCountOpen(alerts),
      openActions:mgCountOpen(actions),
      verifiedEvidence:actions.filter(a=>a.evidenceVerified).length
    };
  };

  /* ----------------------------------------------------------
     30. Make dashboard quick links available after original
     dashboard render without altering its existing markup.
     ---------------------------------------------------------- */
  function mgDashboardEnhancement(){
    if(STATE.view!=='overview')return;
    const area=document.getElementById('page-content');
    if(!area || area.querySelector('.mg-dashboard-extension'))return;
    const role=STATE.role;
    const allowed=['manager','inspector','corporate','regulator'].includes(role);
    if(!allowed)return;
    const box=document.createElement('div');
    box.className='card card-pad mg-dashboard-extension';
    box.style.marginTop='14px';
    box.innerHTML=`<div class="mg-section-title">Workspace Extensions</div><div class="mg-quick-grid">${mgQuickActions(role)}</div>`;
    area.appendChild(box);
  }

  /* ----------------------------------------------------------
     31. Wrap the app renderer once more to attach extensions.
     ---------------------------------------------------------- */
  const MG_RENDER_APP_CORE=renderApp;
  renderApp=function(){
    MG_RENDER_APP_CORE();
    if(STATE.currentUser)mgDashboardEnhancement();
  };

  /* ----------------------------------------------------------
     32. Persistence restore happens AFTER the original app has
     initialized, then the canonical renderer is called again.
     This avoids changing the original initialization order.
     ---------------------------------------------------------- */
  mgNormalizeState();
  const restored=MG_LOAD_STATE();
  mgNormalizeState();
  if(restored && STATE.currentUser){
    renderApp();
  }else{
    renderApp();
  }

  /* ----------------------------------------------------------
     33. Developer-visible hybrid marker in console only.
     ---------------------------------------------------------- */
  console.info('MineGuard Hybrid initialized: original dashboards preserved; workspace features extended.');

})();
</script>
