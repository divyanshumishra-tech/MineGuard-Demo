<script>
/* ============================================================
   MINEGUARD HYBRID COMPLETENESS / GOVERNANCE UTILITIES
   ------------------------------------------------------------
   These utilities are intentionally additive. They do not replace
   the original MineGuard dashboard, risk engine or pages.
   ============================================================ */
(function(){
  'use strict';

  function safeText(v){return esc(v==null?'':v)}
  function arr(v){return Array.isArray(v)?v:[]}
  function num(v,d){const n=Number(v);return Number.isFinite(n)?n:(d||0)}
  function lower(v){return String(v||'').toLowerCase()}
  function openStatus(v){return !['resolved','closed','completed','verified'].includes(lower(v))}
  function dateValue(v){const d=new Date(v);return Number.isNaN(d.getTime())?null:d}

  /* ----------------------------------------------------------
     Governance calculations.
     ---------------------------------------------------------- */
  window.MG_COMPLIANCE_SCORE=function(mineId){
    const m=getMine(mineId);
    if(!m)return 0;
    if(Number.isFinite(Number(m.compliance)))return Math.max(0,Math.min(100,Number(m.compliance)));
    const violations=arr(STATE.violations).filter(v=>mgMineId(v)===mineId&&openStatus(v.status));
    const actions=arr(STATE.correctiveActions).filter(a=>mgActionMine(a)===mineId);
    let score=100;
    score-=Math.min(45,violations.length*8);
    score-=Math.min(25,actions.filter(a=>a.overdue).length*7);
    score-=Math.min(20,actions.filter(a=>lower(a.status).includes('verification')).length*3);
    return Math.max(0,Math.round(score));
  };

  window.MG_MINE_SUMMARY=function(mineId){
    const m=getMine(mineId);
    if(!m)return null;
    const violations=arr(STATE.violations).filter(v=>mgMineId(v)===mineId);
    const actions=arr(STATE.correctiveActions).filter(a=>mgActionMine(a)===mineId);
    const alerts=arr(STATE.alerts).filter(a=>mgMineId(a)===mineId);
    const inspections=arr(STATE.inspections).filter(i=>mgMineId(i)===mineId);
    return {
      id:mineId,
      name:m.name||mineId,
      risk:num(m.risk),
      riskLevel:m.riskLevel||riskLevelOf(num(m.risk)),
      compliance:MG_COMPLIANCE_SCORE(mineId),
      inspections:inspections.length,
      openViolations:violations.filter(v=>openStatus(v.status)).length,
      criticalViolations:violations.filter(v=>lower(mgViolationSeverity(v))==='critical').length,
      openAlerts:alerts.filter(a=>openStatus(a.status)).length,
      openActions:actions.filter(a=>openStatus(a.status)).length,
      overdueActions:actions.filter(a=>a.overdue).length
    };
  };

  window.MG_PORTFOLIO_SUMMARY=function(){
    const mines=arr(STATE.mines);
    const summaries=mines.map(m=>MG_MINE_SUMMARY(m.id)).filter(Boolean);
    return {
      mines:summaries,
      averageRisk:summaries.length?Math.round(summaries.reduce((s,x)=>s+x.risk,0)/summaries.length):0,
      averageCompliance:summaries.length?Math.round(summaries.reduce((s,x)=>s+x.compliance,0)/summaries.length):0,
      critical:summaries.filter(x=>x.riskLevel==='CRITICAL').length,
      high:summaries.filter(x=>x.riskLevel==='HIGH').length,
      medium:summaries.filter(x=>x.riskLevel==='MEDIUM').length,
      low:summaries.filter(x=>x.riskLevel==='LOW').length
    };
  };

  window.MG_OVERDUE_ACTIONS=function(){
    const now=Date.now();
    return arr(STATE.correctiveActions).filter(a=>{
      if(a.overdue)return true;
      if(!a.deadline)return false;
      const d=dateValue(a.deadline);
      return d && d.getTime()<now && openStatus(a.status);
    });
  };

  window.MG_EXPIRING_CERTIFICATIONS=function(days){
    const horizon=Date.now()+num(days,30)*86400000;
    return arr(STATE.certifications).filter(c=>{
      const d=dateValue(c.expiry||c.expiryDate);
      return d && d.getTime()<=horizon;
    });
  };

  /* ----------------------------------------------------------
     Role-aware data selectors.
     ---------------------------------------------------------- */
  window.MG_VISIBLE_MINES=function(){
    const role=STATE.role;
    if(['manager','corporate','regulator','supervisor'].includes(role))return arr(STATE.mines);
    if(role==='inspector'){
      const ids=new Set(arr(STATE.inspections).filter(i=>i.officer===STATE.currentUser.name||i.inspector===STATE.currentUser.name).map(i=>mgMineId(i)));
      return arr(STATE.mines).filter(m=>ids.has(m.id));
    }
    if(role==='contractor'){
      const ids=new Set(arr(STATE.correctiveActions).filter(a=>a.owner===STATE.currentUser.name||a.responsible===STATE.currentUser.name||a.responsibleContractorId===STATE.currentUser.id).map(a=>mgActionMine(a)));
      return arr(STATE.mines).filter(m=>ids.has(m.id));
    }
    return [];
  };

  window.MG_VISIBLE_VIOLATIONS=function(){
    const role=STATE.role;
    if(['manager','corporate','regulator','supervisor'].includes(role))return arr(STATE.violations);
    const me=STATE.currentUser?STATE.currentUser.name:'';
    if(role==='inspector')return arr(STATE.violations).filter(v=>v.inspector===me);
    if(role==='contractor')return arr(STATE.violations).filter(v=>v.inspector===me||v.contractorId===(STATE.currentUser.contractorId||STATE.currentUser.id));
    return [];
  };

  window.MG_VISIBLE_ACTIONS=function(){
    const role=STATE.role;
    if(['manager','corporate','regulator','supervisor'].includes(role))return arr(STATE.correctiveActions);
    const me=STATE.currentUser?STATE.currentUser.name:'';
    return arr(STATE.correctiveActions).filter(a=>a.owner===me||a.responsible===me||a.responsiblePerson===me||a.responsibleContractorId===(STATE.currentUser.contractorId||STATE.currentUser.id));
  };

  /* ----------------------------------------------------------
     Workflow validation helpers.
     ---------------------------------------------------------- */
  window.MG_VALIDATE_INSPECTION=function(id){
    const i=arr(STATE.inspections).find(x=>x.id===id);
    if(!i)return {ok:false,message:'Inspection not found.'};
    if(!STATE.currentUser)return {ok:false,message:'Login required.'};
    if(!MG_HAS_PERMISSION('inspections.perform'))return {ok:false,message:'You do not have inspection execution permission.'};
    const owner=i.officer||i.inspector;
    if(owner && owner!==STATE.currentUser.name && STATE.role==='inspector')return {ok:false,message:'This inspection is not assigned to you.'};
    return {ok:true,inspection:i};
  };

  window.MG_VALIDATE_ACTION=function(id){
    const a=getAction(id);
    if(!a)return {ok:false,message:'Corrective action not found.'};
    if(!STATE.currentUser)return {ok:false,message:'Login required.'};
    const owner=a.owner||a.responsible||a.responsiblePerson;
    if(STATE.role==='contractor' && owner && owner!==STATE.currentUser.name && a.responsibleContractorId!==STATE.currentUser.id)return {ok:false,message:'This corrective action is not assigned to you.'};
    return {ok:true,action:a};
  };

  window.MG_VALIDATE_EVIDENCE=function(actionId){
    const a=getAction(actionId);
    if(!a)return {ok:false,message:'Corrective action not found.'};
    const has=!!(a.evidenceSubmitted||a.evidenceVerified||(a.evidence&&a.evidence.length)||a.evidenceFileName);
    if(!has)return {ok:false,message:'Evidence is required.'};
    if(!a.evidenceVerified)return {ok:false,message:'Evidence is awaiting independent verification.'};
    return {ok:true,action:a};
  };

  /* ----------------------------------------------------------
     Evidence audit helper.
     ---------------------------------------------------------- */
  window.MG_EVIDENCE_STATUS=function(action){
    if(!action)return 'Missing';
    if(action.evidenceVerified)return 'Verified';
    if(action.evidenceSubmitted || (action.evidence&&action.evidence.length))return 'Pending Verification';
    return 'Required';
  };

  window.MG_EVIDENCE_LABEL=function(action){
    const status=MG_EVIDENCE_STATUS(action);
    if(status==='Verified')return '<span class="mg-tag">Verified</span>';
    if(status==='Pending Verification')return '<span class="mg-tag">Pending Verification</span>';
    return '<span class="mg-tag">Required</span>';
  };

  /* ----------------------------------------------------------
     Lightweight report export.
     This remains local-only and does not claim server delivery.
     ---------------------------------------------------------- */
  window.MG_EXPORT_JSON=function(){
    const data=JSON.stringify(MG_REPORT_SUMMARY(),null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='mineguard-report-summary.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),500);
    addAuditEvent('Report exported','Local JSON report summary generated','REPORT','—','Exported');
    MG_SAVE_STATE();
  };

  window.MG_EXPORT_CSV=function(){
    const rows=[['Mine ID','Mine','Risk','Risk Level','Compliance','Open Violations','Open Alerts','Open Actions']];
    MG_PORTFOLIO_SUMMARY().mines.forEach(m=>rows.push([m.id,m.name,m.risk,m.riskLevel,m.compliance,m.openViolations,m.openAlerts,m.openActions]));
    const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='mineguard-mine-summary.csv';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),500);
    addAuditEvent('Report exported','Local CSV mine summary generated','REPORT','—','Exported');
    MG_SAVE_STATE();
  };

  /* ----------------------------------------------------------
     Print report view.
     ---------------------------------------------------------- */
  window.MG_PRINT_SUMMARY=function(){
    const p=MG_PORTFOLIO_SUMMARY();
    const w=window.open('','_blank','width=1000,height=800');
    if(!w){toast('Pop-up blocked. Allow pop-ups to print the report.','error');return;}
    w.document.write(`<!doctype html><html><head><title>MineGuard Governance Summary</title><style>body{font-family:Arial,sans-serif;padding:28px;color:#222}h1{margin:0 0 4px}p{color:#666}table{border-collapse:collapse;width:100%;margin-top:20px}th,td{border:1px solid #ccc;padding:8px;text-align:left;font-size:12px}th{background:#f2f2f2}.k{display:inline-block;margin-right:24px;font-size:20px;font-weight:bold}</style></head><body><h1>MINEGUARD Governance Summary</h1><p>Generated ${safeText(nowStr())}</p><div><span class="k">Mines: ${p.mines.length}</span><span class="k">Avg Risk: ${p.averageRisk}</span><span class="k">Avg Compliance: ${p.averageCompliance}%</span></div><table><thead><tr><th>Mine</th><th>Risk</th><th>Level</th><th>Compliance</th><th>Open Violations</th><th>Open Alerts</th><th>Open Actions</th></tr></thead><tbody>${p.mines.map(m=>`<tr><td>${safeText(m.name)}</td><td>${m.risk}</td><td>${safeText(m.riskLevel)}</td><td>${m.compliance}%</td><td>${m.openViolations}</td><td>${m.openAlerts}</td><td>${m.openActions}</td></tr>`).join('')}</tbody></table></body></html>`);
    w.document.close();
    w.focus();
    setTimeout(()=>w.print(),250);
  };

})();
</script>

<script id="mineguard-governance-utilities">
(function(){
  /* ----------------------------------------------------------
     Quick-access report controls on the reports page. Existing
     reports remain untouched; these controls are appended.
     ---------------------------------------------------------- */
  function addReportUtilities(){
    if(STATE.view!=='reports')return;
    const area=document.getElementById('page-content');
    if(!area||area.querySelector('.mg-report-utilities'))return;
    const card=document.createElement('div');
    card.className='card card-pad mg-report-utilities';
    card.style.marginTop='14px';
    card.innerHTML='<div class="mg-section-title">Local Export Utilities</div><div class="sub" style="margin-bottom:10px;">These exports use current browser state and do not upload data.</div><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn" onclick="MG_EXPORT_JSON()">Export JSON</button><button class="btn" onclick="MG_EXPORT_CSV()">Export CSV</button><button class="btn btn-primary" onclick="MG_PRINT_SUMMARY()">Print Summary</button></div>';
    area.appendChild(card);
  }

  const coreRenderApp=renderApp;
  renderApp=function(){
    coreRenderApp();
    addReportUtilities();
  };

  /* ----------------------------------------------------------
     Data-quality diagnostics. These are callable from the console
     and keep the application maintainable during demonstrations.
     ---------------------------------------------------------- */
  window.MG_RUN_DIAGNOSTICS=function(){
    const issues=[];
    const ids=new Set();
    document.querySelectorAll('[id]').forEach(el=>{if(ids.has(el.id))issues.push('Duplicate DOM id: '+el.id);ids.add(el.id)});
    arr(STATE.mines).forEach(m=>{if(!m.id)issues.push('Mine missing id');});
    arr(STATE.inspections).forEach(i=>{if(!i.id)issues.push('Inspection missing id');if(!getMine(i.mine))issues.push('Inspection '+i.id+' references missing mine '+i.mine);});
    arr(STATE.violations).forEach(v=>{if(!v.id)issues.push('Violation missing id');if(v.mine&&!getMine(v.mine))issues.push('Violation '+v.id+' references missing mine '+v.mine);});
    arr(STATE.alerts).forEach(a=>{if(!a.id)issues.push('Alert missing id');if(a.mine&&!getMine(a.mine))issues.push('Alert '+a.id+' references missing mine '+a.mine);});
    arr(STATE.correctiveActions).forEach(a=>{if(!a.id)issues.push('Corrective action missing id');if(mgActionMine(a)&&!getMine(mgActionMine(a)))issues.push('Action '+a.id+' references missing mine '+mgActionMine(a));});
    const result={ok:issues.length===0,issues,counts:{mines:arr(STATE.mines).length,contractors:arr(STATE.contractors).length,inspections:arr(STATE.inspections).length,violations:arr(STATE.violations).length,alerts:arr(STATE.alerts).length,actions:arr(STATE.correctiveActions).length,certifications:arr(STATE.certifications).length}};
    console.table(result.counts);
    if(issues.length)console.warn('MineGuard diagnostics',issues);else console.info('MineGuard diagnostics passed.');
    return result;
  };

  /* ----------------------------------------------------------
     Automatic risk refresh after meaningful state mutation.
     This only refreshes affected mines and avoids changing the
     original dashboard calculation formula.
     ---------------------------------------------------------- */
  window.MG_REFRESH_ALL_RISK=function(reason){
    arr(STATE.mines).forEach(m=>{
      try{recalculateRisk(m.id);}catch(_e){}
    });
    addAuditEvent('Portfolio risk refresh',reason||'Manual refresh','PORTFOLIO','—','Updated');
    MG_SAVE_STATE();
    renderApp();
  };

  /* ----------------------------------------------------------
     Role summary helper for demo/testing.
     ---------------------------------------------------------- */
  window.MG_ROLE_SUMMARY=function(){
    const roles=Object.keys(DEMO_CREDS);
    return roles.map(role=>({
      role,
      label:DEMO_CREDS[role].label,
      dashboard:role+' dashboard',
      permissions:arr(MG_PERMISSIONS[role]).length,
      navigation:arr(MG_NAV_ITEMS[role]).length
    }));
  };

  /* ----------------------------------------------------------
     Keep persistent state synchronized after browser visibility
     changes so a presentation does not lose the latest work.
     ---------------------------------------------------------- */
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden' && STATE.currentUser)MG_SAVE_STATE();
  });

  /* ----------------------------------------------------------
     End of additive governance utilities.
     ---------------------------------------------------------- */
})();


</script>

<script>
(function(){
  'use strict';
  const MG_OSM_DB='mineguard-osm-cache-v1';
  const MG_OSM_STORE='tiles';
  const MG_OSM_URL='https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  const MG_REAL_POINTS={
    'VIKRAM-001':[23.79,86.43],
    'BCCL-006':[23.79,86.43],
    'CCL-018':[23.34,85.33],
    'MCL-042':[20.95,85.10],
    'MCL-017':[21.47,84.01],
    'SECL-024':[22.10,82.15],
    'WCL-011':[21.15,79.09],
    'ECL-029':[23.68,87.10]
  };
  let MG_MAP=null;
  let MG_TILE_LAYER=null;
  let MG_LEAFLET_LOADING=null;

  function mgLoadLeaflet(){
    if(window.L) return Promise.resolve(window.L);
    if(MG_LEAFLET_LOADING) return MG_LEAFLET_LOADING;
    MG_LEAFLET_LOADING=new Promise(function(resolve,reject){
      if(!document.getElementById('mg-leaflet-css')){
        const link=document.createElement('link');
        link.id='mg-leaflet-css'; link.rel='stylesheet';
        link.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
        document.head.appendChild(link);
      }
      const script=document.createElement('script');
      script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      script.onload=function(){resolve(window.L)};
      script.onerror=function(){reject(new Error('Leaflet could not be loaded. Connect once to initialize the real map.'))};
      document.head.appendChild(script);
    });
    return MG_LEAFLET_LOADING;
  }

  function mgDB(){
    return new Promise(function(resolve,reject){
      const r=indexedDB.open(MG_OSM_DB,1);
      r.onupgradeneeded=function(){ if(!r.result.objectStoreNames.contains(MG_OSM_STORE)) r.result.createObjectStore(MG_OSM_STORE); };
      r.onsuccess=function(){resolve(r.result)}; r.onerror=function(){reject(r.error)};
    });
  }
  async function mgPutTile(key,blob){try{const db=await mgDB();return new Promise((res,rej)=>{const tx=db.transaction(MG_OSM_STORE,'readwrite');tx.objectStore(MG_OSM_STORE).put(blob,key);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error)})}catch(e){return false}}
  async function mgGetTile(key){try{const db=await mgDB();return new Promise((res,rej)=>{const tx=db.transaction(MG_OSM_STORE,'readonly');const r=tx.objectStore(MG_OSM_STORE).get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch(e){return null}}
  function mgTileKey(z,x,y){return z+'/'+x+'/'+y}
  function mgTileUrl(coords){return MG_OSM_URL.replace('{z}',coords.z).replace('{x}',coords.x).replace('{y}',coords.y)}
  function mgSetMapStatus(text,kind){const el=document.getElementById('mgMapStatus');if(el){el.textContent=text;el.className='mg-map-status '+(kind||'')}}

  function mgMakeTileLayer(L){
    const Layer=L.TileLayer.extend({
      createTile:function(coords,done){
        const img=document.createElement('img');
        const key=mgTileKey(coords.z,coords.x,coords.y);
        img.alt='OpenStreetMap tile'; img.setAttribute('role','presentation');
        const finish=function(err){done(err,img)};
        mgGetTile(key).then(async function(blob){
          if(blob){img.src=URL.createObjectURL(blob);finish(null);return}
          if(!navigator.onLine){finish(new Error('Offline tile not cached'));return}
          try{const resp=await fetch(mgTileUrl(coords),{mode:'cors',cache:'no-store'});if(!resp.ok)throw new Error('tile '+resp.status);const b=await resp.blob();await mgPutTile(key,b);img.src=URL.createObjectURL(b);finish(null)}catch(e){finish(e)}
        });
        return img;
      }
    });
    return Layer;
  }

  async function mgDownloadOffline(){
    if(!MG_MAP){toast('Open the map first.','info');return}
    if(!navigator.onLine){toast('Connect to the internet once to download the offline map area.','warn');return}
    const btn=document.getElementById('mgOfflineBtn'); if(btn)btn.disabled=true;
    const center=MG_MAP.getCenter(); const zooms=[5,6]; let total=0,done=0;
    for(const z of zooms){
      const point=MG_MAP.project(center,z), size=256;
      const cx=Math.floor(point.x/size), cy=Math.floor(point.y/size);
      const radius=z===5?1:2;
      for(let dx=-radius;dx<=radius;dx++)for(let dy=-radius;dy<=radius;dy++){
        const n=Math.pow(2,z),x=(cx+dx+n)%n,y=cy+dy;if(y<0||y>=n)continue;total++;
      }
    }
    for(const z of zooms){
      const point=MG_MAP.project(center,z),size=256,cx=Math.floor(point.x/size),cy=Math.floor(point.y/size),radius=z===5?1:2,n=Math.pow(2,z);
      for(let dx=-radius;dx<=radius;dx++)for(let dy=-radius;dy<=radius;dy++){
        const x=(cx+dx+n)%n,y=cy+dy;if(y<0||y>=n)continue;
        const key=mgTileKey(z,x,y); if(await mgGetTile(key)){done++;continue}
        try{const resp=await fetch(mgTileUrl({z:z,x:x,y:y}),{mode:'cors',cache:'no-store'});if(resp.ok){await mgPutTile(key,await resp.blob())}}catch(e){}
        done++; if(done%5===0)mgSetMapStatus('Caching '+done+'/'+total,'cached');
      }
    }
    mgSetMapStatus('OFFLINE MAP READY','cached');
    toast('Real OpenStreetMap tiles cached for offline use.','success');
    if(btn)btn.disabled=false;
    if(MG_MAP)MG_MAP.invalidateSize();
  }

  function mgAddMarkers(L){
    Object.entries(MG_REAL_POINTS).forEach(function(entry){
      const id=entry[0],latlng=entry[1],m=typeof getMine==='function'?getMine(id):null;
      const level=m?m.riskLevel:'MEDIUM', col=typeof riskHex==='function'?riskHex(level):'#3D22A8';
      const icon=L.divIcon({className:'',html:'<div class="mg-leaflet-marker" style="border-color:'+col+';color:'+col+'">⛏</div>',iconSize:[28,28],iconAnchor:[14,14]});
      const marker=L.marker(latlng,{icon:icon}).addTo(MG_MAP);
      marker.bindPopup('<strong>'+id+'</strong><br>'+((m&&m.name)||'MineGuard demo mine')+'<br><span style="font-weight:700;color:'+col+'">'+level+'</span><br><button class="btn btn-sm" style="margin-top:7px" onclick="navigateTo(\'mines\',{mineId:\''+id+'\'})">Open Mine</button>');
    });
  }

  async function mgInitRealMap(){
    const el=document.getElementById('mg-real-map'); if(!el)return;
    try{
      const L=await mgLoadLeaflet();
      if(MG_MAP){MG_MAP.remove();MG_MAP=null}
      MG_MAP=L.map(el,{zoomControl:true,attributionControl:true}).setView([22.4,80.3],5);
      MG_TILE_LAYER=mgMakeTileLayer(L).addTo(MG_MAP);
      MG_MAP.attributionControl.addAttribution('© OpenStreetMap contributors');
      mgAddMarkers(L);
      mgSetMapStatus(navigator.onLine?'ONLINE • LIVE MAP':'OFFLINE • CACHED MAP',navigator.onLine?'online':'offline');
      setTimeout(function(){MG_MAP.invalidateSize()},150);
    }catch(e){
      el.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#344054;background:#F8F9FB"><div><strong>Real map unavailable right now.</strong><br><span style="font-size:12px">Connect once to load Leaflet and cache the OpenStreetMap area for offline use.</span></div></div>';
      toast(e.message||'Unable to initialize map.','warn');
    }
  }

  window.MG_DOWNLOAD_OFFLINE_MAP=mgDownloadOffline;
  window.MG_INIT_REAL_MAP=mgInitRealMap;
  window.addEventListener('online',function(){mgSetMapStatus('ONLINE • LIVE MAP','online')});
  window.addEventListener('offline',function(){mgSetMapStatus('OFFLINE • CACHED MAP','offline')});

  window.renderGis=function(){
    const html=`${pageHeader('GIS / Mine Map','Real OpenStreetMap view of monitored mine regions with offline tile caching.','<button class="btn btn-primary btn-sm" onclick="MG_DOWNLOAD_OFFLINE_MAP()">Download Offline Map</button>')}${demoDataTag()}
      <div class="mg-real-map-shell">
        <div id="mg-real-map"></div>
        <div class="mg-map-toolbar"><button class="btn btn-sm" onclick="MG_INIT_REAL_MAP()">Refresh Map</button><button id="mgOfflineBtn" class="btn btn-sm" onclick="MG_DOWNLOAD_OFFLINE_MAP()">Cache Area for Offline</button></div>
        <div id="mgMapStatus" class="mg-map-status">LOADING MAP…</div>
        <div class="mg-map-legend"><div><strong>MineGuard risk</strong></div><div class="mg-map-legend-row"><span class="mg-map-dot" style="background:#8C1A14"></span>Critical</div><div class="mg-map-legend-row"><span class="mg-map-dot" style="background:#B3261E"></span>High</div><div class="mg-map-legend-row"><span class="mg-map-dot" style="background:#B4791A"></span>Medium</div><div class="mg-map-legend-row"><span class="mg-map-dot" style="background:#1C7A42"></span>Low</div></div>
      </div>
      <div class="mg-offline-note"><strong>Offline workflow:</strong> while connected, use <b>Cache Area for Offline</b>. MineGuard stores the OpenStreetMap tiles locally in the browser. When connectivity is lost, the same real map uses cached tiles instead of the illustrative SVG map. OpenStreetMap tiles are subject to the provider's tile-use policy. </div>
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px"><div class="card"><div class="card-header"><div class="h2">Recent Field Activity</div></div><div>${STATE.inspections.slice(0,6).map(i=>`<div style="padding:11px 16px;border-bottom:1px solid var(--border-soft)"><div style="display:flex;justify-content:space-between"><b class="mono" style="font-size:12.5px">${i.mine}</b><span style="font-size:11px;color:var(--ink-faint)">${i.date.split(' ')[1]||''}</span></div><div style="font-size:12px;margin-top:3px">${esc(i.observation||'Field inspection recorded')}</div></div>`).join('')}</div></div><div class="card card-pad"><div class="h3">Offline readiness</div><div class="sub" style="margin-top:5px">Map tiles are cached locally for the India monitoring region. Inspection records continue using the existing offline queue.</div></div></div>`;
    setTimeout(mgInitRealMap,0);
    return html;
  };
})();
</script>
